name: Databricks Lakehouse Pipeline

on:
  pull_request:
    paths:
      - ".github/workflows/databricks-lakehouse.yml"
      - "Makefile"
      - "databricks/**"
      - "doc/implementation-batches/**"
      - "README.md"
  workflow_dispatch:
    inputs:
      environment:
        description: Databricks bundle target environment
        required: true
        default: dev
        type: choice
        options:
          - dev
      action:
        description: Action to run
        required: true
        default: validate-bundle
        type: choice
        options:
          - validate-bundle
          - deploy-bundle
          - run-pipeline

permissions:
  contents: read

concurrency:
  group: databricks-lakehouse-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
  DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
  DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}

jobs:
  bundle:
    name: Validate, deploy, or run Databricks bundle
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Databricks configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            DATABRICKS_CLIENT_ID \
            DATABRICKS_CLIENT_SECRET \
            DATABRICKS_HOST; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not available. Configure it in the dev GitHub Environment or repository settings."
              exit 1
            fi
          done

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check pipeline Python syntax
        shell: bash
        run: python -m py_compile databricks/energy_market/src/energy_market_pipeline.py

      - name: Validate Databricks bundle
        shell: bash
        run: make databricks-bundle-validate

      - name: Deploy Databricks bundle
        if: github.event_name == 'workflow_dispatch' && (inputs.action == 'deploy-bundle' || inputs.action == 'run-pipeline')
        shell: bash
        run: make databricks-bundle-deploy

      - name: Run Databricks pipeline
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'run-pipeline'
        shell: bash
        run: make databricks-bundle-run
