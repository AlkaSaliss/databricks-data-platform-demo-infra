name: Deploy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Terragrunt environment to deploy
        required: true
        default: dev
        type: choice
        options:
          - dev
      region:
        description: AWS region to deploy
        required: true
        default: eu-west-1
        type: choice
        options:
          - eu-west-1
      action:
        description: Terragrunt action to run
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read

concurrency:
  group: infra-${{ inputs.environment }}-${{ inputs.region }}
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ inputs.action }} active stacks
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: ${{ inputs.region }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      DATABRICKS_ACCOUNT_ID: ${{ secrets.DATABRICKS_ACCOUNT_ID }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_OWNER_EMAIL: ${{ vars.DATABRICKS_OWNER_EMAIL }}
      DATABRICKS_ACCOUNT_ADMINS_JSON: ${{ vars.DATABRICKS_ACCOUNT_ADMINS_JSON }}
      DATABRICKS_USERS_JSON: ${{ vars.DATABRICKS_USERS_JSON }}
      WORKSPACE_USERS_JSON: ${{ vars.WORKSPACE_USERS_JSON }}
      USER_DISPLAY_NAMES_JSON: ${{ vars.USER_DISPLAY_NAMES_JSON }}
      UNITY_ADMIN_GROUP: ${{ vars.UNITY_ADMIN_GROUP }}
      UNITY_USERS_GROUP: ${{ vars.UNITY_USERS_GROUP }}
      CREATE_AUTOMATION_SERVICE_PRINCIPAL: ${{ vars.CREATE_AUTOMATION_SERVICE_PRINCIPAL }}
      AUTOMATION_SERVICE_PRINCIPAL_NAME: ${{ vars.AUTOMATION_SERVICE_PRINCIPAL_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read tool versions
        id: tool-versions
        shell: bash
        run: |
          set -euo pipefail
          terraform_version="$(awk '$1 == "terraform" { print $2 }' src/.tool-versions)"
          terragrunt_version="$(awk '$1 == "terragrunt" { print $2 }' src/.tool-versions)"

          if [ -z "$terraform_version" ] || [ -z "$terragrunt_version" ]; then
            echo "::error::Missing terraform or terragrunt version in src/.tool-versions"
            exit 1
          fi

          echo "terraform=$terraform_version" >> "$GITHUB_OUTPUT"
          echo "terragrunt=$terragrunt_version" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ inputs.region }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.tool-versions.outputs.terraform }}

      - name: Install Terragrunt
        shell: bash
        run: |
          set -euo pipefail
          terragrunt_version="${{ steps.tool-versions.outputs.terragrunt }}"
          curl -fsSL \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${terragrunt_version}/terragrunt_linux_amd64" \
            -o terragrunt
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/terragrunt
          terragrunt --version

      - name: Generate stack tfvars
        shell: bash
        run: |
          set -euo pipefail

          require() {
            local name="$1"
            if [ -z "${!name:-}" ]; then
              echo "::error::$name must be configured as a GitHub Environment variable or secret"
              exit 1
            fi
          }

          require DATABRICKS_ACCOUNT_ID
          require DATABRICKS_CLIENT_ID
          require DATABRICKS_CLIENT_SECRET
          require DATABRICKS_OWNER_EMAIL
          require DATABRICKS_ACCOUNT_ADMINS_JSON

          live_dir="src/live/${{ inputs.environment }}/${{ inputs.region }}"
          test -d "$live_dir" || {
            echo "::error::Live directory not found: $live_dir"
            exit 1
          }

          databricks_users_json="${DATABRICKS_USERS_JSON:-[]}"
          workspace_users_json="${WORKSPACE_USERS_JSON:-[]}"
          user_display_names_json="${USER_DISPLAY_NAMES_JSON:-{}}"
          unity_admin_group="${UNITY_ADMIN_GROUP:-Unity Catalog Admins}"
          unity_users_group="${UNITY_USERS_GROUP:-Unity Catalog Users}"
          create_automation_service_principal="${CREATE_AUTOMATION_SERVICE_PRINCIPAL:-false}"
          automation_service_principal_name="${AUTOMATION_SERVICE_PRINCIPAL_NAME:-terraform-automation-sp}"

          cat > "$live_dir/account-admin/terraform.tfvars" <<EOF
          databricks_account_admins = ${DATABRICKS_ACCOUNT_ADMINS_JSON}
          databricks_users = ${databricks_users_json}
          user_display_names = ${user_display_names_json}
          unity_admin_group = "${unity_admin_group}"
          unity_users_group = "${unity_users_group}"
          create_automation_service_principal = ${create_automation_service_principal}
          automation_service_principal_name = "${automation_service_principal_name}"
          EOF

          cat > "$live_dir/workspace-infra/terraform.tfvars" <<EOF
          ws_users = ${workspace_users_json}
          EOF

      - name: Run active stacks sequentially
        shell: bash
        run: |
          set -euo pipefail

          case "${{ inputs.action }}" in
            plan)
              make plan-active-all ENV="${{ inputs.environment }}" REGION="${{ inputs.region }}"
              ;;
            apply)
              make deploy-active-all ENV="${{ inputs.environment }}" REGION="${{ inputs.region }}"
              ;;
            *)
              echo "::error::Unsupported action: ${{ inputs.action }}"
              exit 1
              ;;
          esac
