name: Deploy Databricks Demo Workspace Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Terragrunt environment to deploy
        required: true
        default: dev
        type: choice
        options:
          - dev
      region:
        description: AWS region to deploy
        required: true
        default: eu-west-1
        type: choice
        options:
          - eu-west-1
      action:
        description: Deployment action to run
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy
          - deploy-bundle
          - run-pipeline

permissions:
  contents: read

concurrency:
  group: deploy-infra-${{ inputs.environment }}-${{ inputs.region }}
  cancel-in-progress: false

jobs:
  plan:
    name: Validate and plan active stacks
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      databricks_host: ${{ steps.resolve-databricks-host.outputs.databricks_host }}
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      REGION: ${{ inputs.region }}
      AWS_REGION: ${{ inputs.region }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      DATABRICKS_ACCOUNT_ID: ${{ secrets.DATABRICKS_ACCOUNT_ID }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_OWNER_EMAIL: ${{ vars.DATABRICKS_OWNER_EMAIL }}
      DATABRICKS_ACCOUNT_ADMINS_JSON: ${{ vars.DATABRICKS_ACCOUNT_ADMINS_JSON }}
      DATABRICKS_USERS_JSON: ${{ vars.DATABRICKS_USERS_JSON }}
      WORKSPACE_USERS_JSON: ${{ vars.WORKSPACE_USERS_JSON }}
      USER_DISPLAY_NAMES_JSON: ${{ vars.USER_DISPLAY_NAMES_JSON }}
      UNITY_ADMIN_GROUP: ${{ vars.UNITY_ADMIN_GROUP }}
      UNITY_USERS_GROUP: ${{ vars.UNITY_USERS_GROUP }}
      CREATE_AUTOMATION_SERVICE_PRINCIPAL: ${{ vars.CREATE_AUTOMATION_SERVICE_PRINCIPAL }}
      AUTOMATION_SERVICE_PRINCIPAL_NAME: ${{ vars.AUTOMATION_SERVICE_PRINCIPAL_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read tool versions
        id: tool-versions
        shell: bash
        run: |
          set -euo pipefail
          terraform_version="$(awk '$1 == "terraform" { print $2 }' .tool-versions)"
          terragrunt_version="$(awk '$1 == "terragrunt" { print $2 }' .tool-versions)"

          if [ -z "$terraform_version" ] || [ -z "$terragrunt_version" ]; then
            echo "::error::Missing terraform or terragrunt version in .tool-versions"
            exit 1
          fi

          echo "terraform=$terraform_version" >> "$GITHUB_OUTPUT"
          echo "terragrunt=$terragrunt_version" >> "$GITHUB_OUTPUT"

      - name: Verify GitHub configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            AWS_ACCESS_KEY_ID \
            AWS_SECRET_ACCESS_KEY \
            DATABRICKS_ACCOUNT_ID \
            DATABRICKS_CLIENT_ID \
            DATABRICKS_CLIENT_SECRET \
            DATABRICKS_OWNER_EMAIL \
            DATABRICKS_ACCOUNT_ADMINS_JSON; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not available. Configure it in the $ENVIRONMENT GitHub Environment or repository settings."
              exit 1
            fi
          done

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ inputs.region }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.tool-versions.outputs.terraform }}

      - name: Install Terragrunt
        shell: bash
        run: |
          set -euo pipefail
          terragrunt_version="${{ steps.tool-versions.outputs.terragrunt }}"
          curl -fsSL \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${terragrunt_version}/terragrunt_linux_amd64" \
            -o terragrunt
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/terragrunt
          terragrunt --version

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate stack tfvars
        shell: bash
        run: scripts/generate-ci-tfvars.sh "$ENVIRONMENT" "$REGION"

      - name: Check formatting
        shell: bash
        run: make fmt-check

      - name: Validate Terragrunt HCL
        shell: bash
        run: make hcl-validate-active-all ENV="$ENVIRONMENT" REGION="$REGION"

      - name: Validate Terraform through Terragrunt
        shell: bash
        run: make validate-active-all ENV="$ENVIRONMENT" REGION="$REGION"

      - name: Plan active stacks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          make plan-active-all ENV="$ENVIRONMENT" REGION="$REGION" 2>&1 | tee logs/plan-active-all.log

      - name: Check pipeline Python syntax
        if: inputs.action != 'destroy'
        shell: bash
        run: python -m py_compile databricks/energy_market/src/energy_market_pipeline.py

      - name: Resolve Databricks workspace host
        id: resolve-databricks-host
        if: inputs.action == 'deploy-bundle' || inputs.action == 'run-pipeline'
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${DATABRICKS_HOST:-}" ]; then
            workspace_url="$DATABRICKS_HOST"
          else
            raw_workspace_output="$(
              cd "src/live/$ENVIRONMENT/$REGION/workspace-infra" &&
              terragrunt output -raw databricks_workspace_url 2>/dev/null || true
            )"

            workspace_url="$(
              printf '%s\n' "$raw_workspace_output" |
              awk '
                /^[[:space:]]*(https:\/\/)?[A-Za-z0-9.-]+(\.cloud\.databricks\.com|\.azuredatabricks\.net)/ {
                  gsub(/^[[:space:]]+|[[:space:]]+$/, "")
                  print
                  exit
                }
              '
            )"

            if [ -z "$workspace_url" ]; then
              echo "::error::DATABRICKS_HOST is not configured and workspace-infra has no databricks_workspace_url output yet."
              exit 1
            fi
          fi

          if [[ "$workspace_url" == https://* ]]; then
            host="$workspace_url"
          else
            host="https://$workspace_url"
          fi

          printf 'DATABRICKS_HOST=%s\n' "$host" >> "$GITHUB_ENV"
          printf 'databricks_host=%s\n' "$host" >> "$GITHUB_OUTPUT"

      - name: Validate Databricks bundle
        if: inputs.action == 'deploy-bundle' || inputs.action == 'run-pipeline'
        shell: bash
        run: make databricks-bundle-validate

      - name: Upload plan logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-infra-plan-logs
          path: logs/
          if-no-files-found: ignore

  apply:
    name: Apply active stacks
    runs-on: ubuntu-latest
    needs: plan
    if: inputs.action == 'apply' || inputs.action == 'destroy'
    environment: ${{ inputs.environment }}
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      REGION: ${{ inputs.region }}
      AWS_REGION: ${{ inputs.region }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      DATABRICKS_ACCOUNT_ID: ${{ secrets.DATABRICKS_ACCOUNT_ID }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_OWNER_EMAIL: ${{ vars.DATABRICKS_OWNER_EMAIL }}
      DATABRICKS_ACCOUNT_ADMINS_JSON: ${{ vars.DATABRICKS_ACCOUNT_ADMINS_JSON }}
      DATABRICKS_USERS_JSON: ${{ vars.DATABRICKS_USERS_JSON }}
      WORKSPACE_USERS_JSON: ${{ vars.WORKSPACE_USERS_JSON }}
      USER_DISPLAY_NAMES_JSON: ${{ vars.USER_DISPLAY_NAMES_JSON }}
      UNITY_ADMIN_GROUP: ${{ vars.UNITY_ADMIN_GROUP }}
      UNITY_USERS_GROUP: ${{ vars.UNITY_USERS_GROUP }}
      CREATE_AUTOMATION_SERVICE_PRINCIPAL: ${{ vars.CREATE_AUTOMATION_SERVICE_PRINCIPAL }}
      AUTOMATION_SERVICE_PRINCIPAL_NAME: ${{ vars.AUTOMATION_SERVICE_PRINCIPAL_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read tool versions
        id: tool-versions
        shell: bash
        run: |
          set -euo pipefail
          terraform_version="$(awk '$1 == "terraform" { print $2 }' .tool-versions)"
          terragrunt_version="$(awk '$1 == "terragrunt" { print $2 }' .tool-versions)"

          if [ -z "$terraform_version" ] || [ -z "$terragrunt_version" ]; then
            echo "::error::Missing terraform or terragrunt version in .tool-versions"
            exit 1
          fi

          echo "terraform=$terraform_version" >> "$GITHUB_OUTPUT"
          echo "terragrunt=$terragrunt_version" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ inputs.region }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.tool-versions.outputs.terraform }}

      - name: Install Terragrunt
        shell: bash
        run: |
          set -euo pipefail
          terragrunt_version="${{ steps.tool-versions.outputs.terragrunt }}"
          curl -fsSL \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${terragrunt_version}/terragrunt_linux_amd64" \
            -o terragrunt
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/terragrunt
          terragrunt --version

      - name: Generate stack tfvars
        shell: bash
        run: scripts/generate-ci-tfvars.sh "$ENVIRONMENT" "$REGION"

      - name: Apply or destroy active stacks sequentially
        shell: bash
        run: |
          set -euo pipefail

          case "${{ inputs.action }}" in
            apply)
              make deploy-active-all ENV="$ENVIRONMENT" REGION="$REGION"
              ;;
            destroy)
              make destroy-active-all ENV="$ENVIRONMENT" REGION="$REGION"
              ;;
            *)
              echo "::error::Unsupported apply job action: ${{ inputs.action }}"
              exit 1
              ;;
          esac

  bundle:
    name: Deploy or run Databricks bundle
    runs-on: ubuntu-latest
    needs: plan
    if: inputs.action == 'deploy-bundle' || inputs.action == 'run-pipeline'
    environment: ${{ inputs.environment }}
    env:
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST != '' && vars.DATABRICKS_HOST || needs.plan.outputs.databricks_host }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Databricks configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            DATABRICKS_CLIENT_ID \
            DATABRICKS_CLIENT_SECRET \
            DATABRICKS_HOST; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not available. Configure it in the ${{ inputs.environment }} GitHub Environment or repository settings."
              exit 1
            fi
          done

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy Databricks bundle
        shell: bash
        run: make databricks-bundle-deploy

      - name: Run Databricks pipeline
        if: inputs.action == 'run-pipeline'
        shell: bash
        run: make databricks-bundle-run
