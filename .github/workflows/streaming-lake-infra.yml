name: Streaming Lake Infrastructure

on:
  pull_request:
    paths:
      - ".github/workflows/streaming-lake-infra.yml"
      - "Makefile"
      - "src/live/**/streaming-lake-infra/**"
      - "src/modules/streaming-lake-infra/**"
      - "doc/streaming-lake-infra.md"
      - "doc/implementation-batches/**"
      - "README.md"
  workflow_dispatch:
    inputs:
      environment:
        description: Terragrunt environment to deploy
        required: true
        default: dev
        type: choice
        options:
          - dev
      region:
        description: AWS region to deploy
        required: true
        default: eu-west-1
        type: choice
        options:
          - eu-west-1
      action:
        description: Deployment action to run
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read

concurrency:
  group: streaming-lake-infra-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}-${{ github.event_name == 'workflow_dispatch' && inputs.region || 'eu-west-1' }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
  REGION: ${{ github.event_name == 'workflow_dispatch' && inputs.region || 'eu-west-1' }}
  STACK: streaming-lake-infra
  AWS_REGION: ${{ github.event_name == 'workflow_dispatch' && inputs.region || 'eu-west-1' }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

jobs:
  validate-and-plan:
    name: Validate and plan Streaming Lake stack
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read tool versions
        id: tool-versions
        shell: bash
        run: |
          set -euo pipefail
          terraform_version="$(awk '$1 == "terraform" { print $2 }' .tool-versions)"
          terragrunt_version="$(awk '$1 == "terragrunt" { print $2 }' .tool-versions)"

          if [ -z "$terraform_version" ] || [ -z "$terragrunt_version" ]; then
            echo "::error::Missing terraform or terragrunt version in .tool-versions"
            exit 1
          fi

          echo "terraform=$terraform_version" >> "$GITHUB_OUTPUT"
          echo "terragrunt=$terragrunt_version" >> "$GITHUB_OUTPUT"

      - name: Verify GitHub configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            AWS_ACCESS_KEY_ID \
            AWS_SECRET_ACCESS_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not available. Configure it as a GitHub secret for the $ENVIRONMENT environment or repository."
              exit 1
            fi
          done

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.tool-versions.outputs.terraform }}

      - name: Install Terragrunt
        shell: bash
        run: |
          set -euo pipefail
          terragrunt_version="${{ steps.tool-versions.outputs.terragrunt }}"
          curl -fsSL \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${terragrunt_version}/terragrunt_linux_amd64" \
            -o terragrunt
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/terragrunt
          terragrunt --version

      - name: Check formatting
        shell: bash
        run: make fmt-check

      - name: Validate Terragrunt HCL
        shell: bash
        run: make hcl-validate ENV="$ENVIRONMENT" REGION="$REGION" STACK="$STACK"

      - name: Validate Terraform through Terragrunt
        shell: bash
        run: make validate ENV="$ENVIRONMENT" REGION="$REGION" STACK="$STACK"

      - name: Plan Streaming Lake stack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          make plan ENV="$ENVIRONMENT" REGION="$REGION" STACK="$STACK" 2>&1 | tee logs/streaming-lake-infra-plan.log

      - name: Upload plan logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streaming-lake-infra-plan-logs
          path: logs/
          if-no-files-found: ignore

  deploy:
    name: Apply or destroy Streaming Lake stack
    runs-on: ubuntu-latest
    needs: validate-and-plan
    if: github.event_name == 'workflow_dispatch' && (inputs.action == 'apply' || inputs.action == 'destroy')
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read tool versions
        id: tool-versions
        shell: bash
        run: |
          set -euo pipefail
          terraform_version="$(awk '$1 == "terraform" { print $2 }' .tool-versions)"
          terragrunt_version="$(awk '$1 == "terragrunt" { print $2 }' .tool-versions)"

          if [ -z "$terraform_version" ] || [ -z "$terragrunt_version" ]; then
            echo "::error::Missing terraform or terragrunt version in .tool-versions"
            exit 1
          fi

          echo "terraform=$terraform_version" >> "$GITHUB_OUTPUT"
          echo "terragrunt=$terragrunt_version" >> "$GITHUB_OUTPUT"

      - name: Verify GitHub configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            AWS_ACCESS_KEY_ID \
            AWS_SECRET_ACCESS_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not available. Configure it as a GitHub secret for the ${{ inputs.environment }} environment or repository."
              exit 1
            fi
          done

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ inputs.region }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.tool-versions.outputs.terraform }}

      - name: Install Terragrunt
        shell: bash
        run: |
          set -euo pipefail
          terragrunt_version="${{ steps.tool-versions.outputs.terragrunt }}"
          curl -fsSL \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${terragrunt_version}/terragrunt_linux_amd64" \
            -o terragrunt
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/terragrunt
          terragrunt --version

      - name: Apply or destroy Streaming Lake stack
        shell: bash
        run: |
          set -euo pipefail

          case "${{ inputs.action }}" in
            apply)
              make deploy-ci ENV="${{ inputs.environment }}" REGION="${{ inputs.region }}" STACK="streaming-lake-infra"
              ;;
            destroy)
              make destroy-ci ENV="${{ inputs.environment }}" REGION="${{ inputs.region }}" STACK="streaming-lake-infra"
              ;;
            *)
              echo "::error::Unsupported deploy action: ${{ inputs.action }}"
              exit 1
              ;;
          esac
