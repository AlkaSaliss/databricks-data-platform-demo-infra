[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-market-producers"
version = "0.3.0"
description = "Infrastructure and producer utilities for the Databricks data platform demo."
requires-python = ">=3.11"
dependencies = [
  "confluent-kafka>=2.6,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
include = ["producers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
