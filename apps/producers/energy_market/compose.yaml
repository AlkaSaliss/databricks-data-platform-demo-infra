services:
  france-eco2mix-producer:
    build:
      context: .
    image: energy-market-france-eco2mix-producer:local
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-}
      KAFKA_API_KEY: ${KAFKA_API_KEY:-}
      KAFKA_API_SECRET: ${KAFKA_API_SECRET:-}
    command: ["--last-days", "${LAST_DAYS:-1}"]
