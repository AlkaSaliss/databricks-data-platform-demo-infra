[project]
name = "energy-market-command-center"
version = "0.1.0"
description = "France-first energy market streaming command center demo."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apache-flink>=1.19.0",
    "boto3>=1.34.0",
    "confluent-kafka>=2.4.0",
    "pyyaml>=6.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]

[project.scripts]
energy-market-validate-config = "energy_market_command_center.config:main"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
