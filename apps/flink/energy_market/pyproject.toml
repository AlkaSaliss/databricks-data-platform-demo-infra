[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-market-flink"
version = "0.1.0"
description = "Local PyFlink jobs for the energy market demo."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
include = ["jobs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
